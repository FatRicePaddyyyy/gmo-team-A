name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.26.0"
  NODE_OPTIONS: "--max_old_space_size=4096"

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/frontend/node_modules
            apps/backend/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

  tsc-frontend:
    name: TypeScript (frontend)
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/frontend/node_modules
            apps/backend/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        working-directory: apps/frontend
        run: pnpm exec tsc --noEmit

  tsc-backend:
    name: TypeScript (backend)
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/frontend/node_modules
            apps/backend/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        working-directory: apps/backend
        run: pnpm exec tsc --noEmit

  lint:
    name: Lint
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/frontend/node_modules
            apps/backend/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint

  vitest:
    name: Unit tests (backend)
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/frontend/node_modules
            apps/backend/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        working-directory: apps/backend
        run: pnpm test:run

  playwright:
    # レジストリ疎通の要件で project を分割している (apps/frontend/playwright.config.ts 参照)。
    # secret は 5 ジョブすべてに同じ内容を渡す。CI 側で意図的に片方を落とす操作はしない
    # (現実のレジストリのメンテ時間帯に normal/outage の緑赤が入れ替わる想定)。
    #
    # - registry-none    : レジストリ疎通が無くても動くべき UI テスト。常時緑。
    # - kitaqsign-normal : kitaqsign 稼働時にだけ緑になる正常系 (.com 検索・購入)
    # - kitaqsign-outage : kitaqsign 障害時にだけ緑になる異常系 (.com が「確認できませんでした」枠)
    # - kitaqnic-normal  : kitaqnic 稼働時にだけ緑になる正常系 (.xyz 検索・購入)
    # - kitaqnic-outage  : kitaqnic 障害時にだけ緑になる異常系 (.xyz が「確認できませんでした」枠)
    name: E2E tests (Playwright / ${{ matrix.project }})
    needs: [tsc-frontend, tsc-backend, lint]
    runs-on: ubuntu-latest
    strategy:
      # normal ジョブと outage ジョブは片方が失敗しても他方の実行結果が要る。
      fail-fast: false
      matrix:
        project:
          - registry-none
          - kitaqsign-normal
          - kitaqsign-outage
          - kitaqnic-normal
          - kitaqnic-outage
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/frontend/node_modules
            apps/backend/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: apps/frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Run DB migration (local)
        working-directory: apps/backend
        run: pnpm db:migrate:local
      - name: Start backend dev server
        working-directory: apps/backend
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          # 全ジョブに両レジストリの secret を渡す。CI で疎通を意図的に切らない。
          KITAQSIGN_BASIC_USER: ${{ secrets.KITAQSIGN_BASIC_USER }}
          KITAQSIGN_BASIC_PASS: ${{ secrets.KITAQSIGN_BASIC_PASS }}
          KITAQSIGN_REGISTRAR_ID: ${{ secrets.KITAQSIGN_REGISTRAR_ID }}
          KITAQSIGN_API_KEY: ${{ secrets.KITAQSIGN_API_KEY }}
          KITAQNIC_BASIC_USER: ${{ secrets.KITAQNIC_BASIC_USER }}
          KITAQNIC_BASIC_PASS: ${{ secrets.KITAQNIC_BASIC_PASS }}
          KITAQNIC_REGISTRAR_ID: ${{ secrets.KITAQNIC_REGISTRAR_ID }}
          KITAQNIC_API_KEY: ${{ secrets.KITAQNIC_API_KEY }}
        run: |
          # wrangler dev に secrets を渡す (.dev.vars は wrangler が自動で読み込む)
          {
            printf 'BETTER_AUTH_SECRET=%s\n' "$BETTER_AUTH_SECRET"
            printf 'SECRET_KEY=%s\n' "$SECRET_KEY"
            printf 'KITAQSIGN_BASIC_USER=%s\n' "$KITAQSIGN_BASIC_USER"
            printf 'KITAQSIGN_BASIC_PASS=%s\n' "$KITAQSIGN_BASIC_PASS"
            printf 'KITAQSIGN_REGISTRAR_ID=%s\n' "$KITAQSIGN_REGISTRAR_ID"
            printf 'KITAQSIGN_API_KEY=%s\n' "$KITAQSIGN_API_KEY"
            printf 'KITAQNIC_BASIC_USER=%s\n' "$KITAQNIC_BASIC_USER"
            printf 'KITAQNIC_BASIC_PASS=%s\n' "$KITAQNIC_BASIC_PASS"
            printf 'KITAQNIC_REGISTRAR_ID=%s\n' "$KITAQNIC_REGISTRAR_ID"
            printf 'KITAQNIC_API_KEY=%s\n' "$KITAQNIC_API_KEY"
          } > .dev.vars
          pnpm dev &
          echo "Backend PID: $!"
          # /api は OpenAPI spec を返す認証不要エンドポイント
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8787/api || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Backend is ready after ${i}x2s"
              break
            fi
            echo "Waiting for backend... ($i/30) (HTTP $STATUS)"
            sleep 2
          done
      - name: Run Playwright tests (${{ matrix.project }})
        working-directory: apps/frontend
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:8787
          # /api/v1/secret/create-seed-user を叩いてテストユーザーを作るために必要
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          # 移管 e2e (transfer-*.spec.ts) 用の teama-2 側 credentials。
          # helper が T2_ prefix で読むので、そのまま T2_ 付きで注入する。
          T2_KITAQSIGN_BASIC_USER: ${{ secrets.T2_KITAQSIGN_BASIC_USER }}
          T2_KITAQSIGN_BASIC_PASS: ${{ secrets.T2_KITAQSIGN_BASIC_PASS }}
          T2_KITAQSIGN_REGISTRAR_ID: ${{ secrets.T2_KITAQSIGN_REGISTRAR_ID }}
          T2_KITAQSIGN_API_KEY: ${{ secrets.T2_KITAQSIGN_API_KEY }}
          T2_KITAQNIC_BASIC_USER: ${{ secrets.T2_KITAQNIC_BASIC_USER }}
          T2_KITAQNIC_BASIC_PASS: ${{ secrets.T2_KITAQNIC_BASIC_PASS }}
          T2_KITAQNIC_REGISTRAR_ID: ${{ secrets.T2_KITAQNIC_REGISTRAR_ID }}
          T2_KITAQNIC_API_KEY: ${{ secrets.T2_KITAQNIC_API_KEY }}
        run: pnpm exec playwright test --project=${{ matrix.project }}
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report-${{ matrix.project }}
          path: apps/frontend/playwright-report
          retention-days: 7

