name: Deploy Backend

on:
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.26.0"
  NODE_OPTIONS: "--max_old_space_size=4096"

jobs:
  deploy:
    name: Deploy backend to Cloudflare Workers
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build & Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/backend
          preCommands: |
            printf '%s' "${{ secrets.BETTER_AUTH_SECRET }}" | npx wrangler secret put BETTER_AUTH_SECRET --env production
            printf '%s' "${{ secrets.SECRET_KEY }}" | npx wrangler secret put SECRET_KEY --env production
            printf '%s' "${{ secrets.KITAQSIGN_BASIC_USER }}" | npx wrangler secret put KITAQSIGN_BASIC_USER --env production
            printf '%s' "${{ secrets.KITAQSIGN_BASIC_PASS }}" | npx wrangler secret put KITAQSIGN_BASIC_PASS --env production
            printf '%s' "${{ secrets.KITAQSIGN_REGISTRAR_ID }}" | npx wrangler secret put KITAQSIGN_REGISTRAR_ID --env production
            printf '%s' "${{ secrets.KITAQSIGN_API_KEY }}" | npx wrangler secret put KITAQSIGN_API_KEY --env production
            printf '%s' "${{ secrets.KITAQNIC_BASIC_USER }}" | npx wrangler secret put KITAQNIC_BASIC_USER --env production
            printf '%s' "${{ secrets.KITAQNIC_BASIC_PASS }}" | npx wrangler secret put KITAQNIC_BASIC_PASS --env production
            printf '%s' "${{ secrets.KITAQNIC_REGISTRAR_ID }}" | npx wrangler secret put KITAQNIC_REGISTRAR_ID --env production
            printf '%s' "${{ secrets.KITAQNIC_API_KEY }}" | npx wrangler secret put KITAQNIC_API_KEY --env production
          command: deploy --env=production
